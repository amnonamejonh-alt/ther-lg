<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I'm Really Sorry, Seav Mey 💗</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@400;600;800&display=swap');

  :root {
    --bg-start: #ffe6f0;
    --bg-mid: #ffd1e4;
    --bg-end: #fed8eb;
    --text-dark: #8c2a54;
    --text-muted: #7d445d;
    --accent: #e44284;
    --accent-bright: #ff3b77;
    --card-bg: rgba(255, 255, 255, 0.88);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    overflow: hidden;
    font-family: 'Quicksand', 'Nunito', sans-serif;
    background: radial-gradient(circle at top left, var(--bg-start) 0%, var(--bg-mid) 50%, var(--bg-end) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dark);
    position: relative;
    user-select: none;
  }

  .bg-glow {
    position: absolute;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(255, 182, 217, 0.45) 0%, rgba(255, 255, 255, 0) 70%);
    border-radius: 50%;
    animation: pulseGlow 6s ease-in-out infinite alternate;
    pointer-events: none;
  }

  @keyframes pulseGlow {
    0% { transform: scale(0.85) translate(-40px, -30px); opacity: 0.6; }
    100% { transform: scale(1.15) translate(40px, 30px); opacity: 0.95; }
  }

  .card {
    position: relative;
    z-index: 10;
    width: min(92%, 400px);
    padding: 28px 24px 24px;
    text-align: center;
    background: var(--card-bg);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 2px solid rgba(255, 255, 255, 0.95);
    border-radius: 36px;
    box-shadow: 0 20px 50px rgba(224, 88, 145, 0.22), 0 6px 16px rgba(255, 255, 255, 0.8) inset;
    animation: cardAppear 1s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
  }

  @keyframes cardAppear {
    from { opacity: 0; transform: translateY(40px) scale(0.92); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .character-wrapper {
    position: relative;
    width: 170px;
    height: 195px;
    margin: 0 auto 10px;
    cursor: pointer;
    transition: transform 0.3s ease;
  }

  .character-wrapper:hover {
    transform: scale(1.04);
  }

  .character-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
    filter: drop-shadow(0 8px 16px rgba(220, 80, 130, 0.2));
  }

  .char-body-group {
    transform-origin: center bottom;
    animation: gentleBreathe 3s ease-in-out infinite;
  }

  @keyframes gentleBreathe {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-4px) scale(1.01, 0.99); }
  }

  .eye-open {
    animation: blinkEyes 4s infinite ease-in-out;
    transform-origin: center;
  }

  @keyframes blinkEyes {
    0%, 94%, 98%, 100% { transform: scaleY(1); opacity: 1; }
    96% { transform: scaleY(0.08); opacity: 0.8; }
  }

  .hair-side-l, .hair-side-r {
    transform-origin: top center;
    animation: hairSway 3.6s ease-in-out infinite alternate;
  }

  .hair-side-r {
    animation-delay: -1.8s;
  }

  @keyframes hairSway {
    0% { transform: rotate(-2.5deg); }
    100% { transform: rotate(2.5deg); }
  }

  .holding-item {
    transform-origin: center;
    animation: heartBeat 1.8s ease-in-out infinite;
  }

  @keyframes heartBeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }

  .tear-drop {
    animation: tearGlisten 2.5s ease-in-out infinite;
    transform-origin: top center;
  }

  @keyframes tearGlisten {
    0%, 100% { opacity: 0.4; transform: translateY(0); }
    50% { opacity: 0.95; transform: translateY(3px); }
  }

  .character-wrapper.happy .char-body-group {
    animation: happyJump 0.6s ease-in-out infinite alternate;
  }

  @keyframes happyJump {
    0% { transform: translateY(0) rotate(-2deg); }
    100% { transform: translateY(-14px) rotate(2deg); }
  }

  .character-wrapper.happy .eye-sad,
  .character-wrapper.happy .mouth-sad,
  .character-wrapper.happy .tear-drop {
    display: none !important;
  }

  .character-wrapper.happy .eye-happy,
  .character-wrapper.happy .mouth-happy,
  .character-wrapper.happy .sparkle-stars {
    display: block !important;
  }

  .sparkle-stars {
    display: none;
    animation: starRotate 2s linear infinite;
    transform-origin: center;
  }

  @keyframes starRotate {
    0% { transform: scale(0.9) rotate(0deg); opacity: 0.8; }
    50% { transform: scale(1.2) rotate(180deg); opacity: 1; }
    100% { transform: scale(0.9) rotate(360deg); opacity: 0.8; }
  }

  .mood-badge {
    position: absolute;
    top: 6px;
    right: 14px;
    background: #ffffff;
    padding: 3px 8px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    box-shadow: 0 4px 10px rgba(220, 80, 130, 0.2);
    display: flex;
    align-items: center;
    gap: 4px;
    animation: floatBadge 2.2s ease-in-out infinite alternate;
  }

  @keyframes floatBadge {
    0% { transform: translateY(0); }
    100% { transform: translateY(-5px); }
  }

  h1 {
    font-size: 25px;
    font-weight: 700;
    color: var(--accent);
    margin: 6px 0 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    text-shadow: 0 2px 4px rgba(230, 80, 130, 0.15);
  }

  .subtitle {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-muted);
    line-height: 1.5;
    margin-bottom: 8px;
    padding: 0 10px;
  }

  .question {
    font-size: 16px;
    font-weight: 700;
    color: var(--accent);
    margin: 14px 0 16px;
  }

  .btn-group {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    min-height: 52px;
  }

  button {
    font-family: inherit;
    border: none;
    outline: none;
    padding: 12px 24px;
    border-radius: 50px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  #yes {
    background: linear-gradient(135deg, #ff609a, #e6377e);
    color: #ffffff;
    box-shadow: 0 7px 20px rgba(235, 60, 130, 0.4);
    animation: yesPulse 2s infinite ease-in-out;
  }

  @keyframes yesPulse {
    0%, 100% { transform: scale(1); box-shadow: 0 7px 20px rgba(235, 60, 130, 0.4); }
    50% { transform: scale(1.05); box-shadow: 0 10px 25px rgba(235, 60, 130, 0.6); }
  }

  #yes:hover {
    transform: scale(1.12);
    background: linear-gradient(135deg, #ff4c8f, #d8236d);
  }

  #no {
    background: #ffe3ef;
    color: #cf437d;
    border: 1.5px solid #ffbfdc;
    box-shadow: 0 4px 12px rgba(220, 100, 150, 0.15);
    white-space: nowrap;
  }

  #no:hover {
    background: #ffd3e7;
  }

  #celebration {
    display: none;
    margin-top: 12px;
    animation: popIn 0.6s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
  }

  @keyframes popIn {
    0% { opacity: 0; transform: scale(0.7); }
    100% { opacity: 1; transform: scale(1); }
  }

  .celebration-title {
    font-size: 26px;
    font-weight: 800;
    color: #ff3381;
    margin-bottom: 6px;
    animation: cheerBounce 0.8s ease infinite alternate;
  }

  @keyframes cheerBounce {
    0% { transform: scale(0.98); }
    100% { transform: scale(1.06); }
  }

  .celebration-text {
    font-size: 16px;
    font-weight: 600;
    color: #6d334e;
  }

  .footer-heart {
    margin-top: 14px;
    font-size: 12px;
    font-weight: 600;
    color: #d1759d;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }

  .float-item {
    position: absolute;
    bottom: -60px;
    pointer-events: none;
    user-select: none;
    z-index: 1;
    animation: floatParticle linear forwards;
  }

  @keyframes floatParticle {
    0% { transform: translateY(0) rotate(0deg) scale(0.6); opacity: 0; }
    15%, 90% { opacity: 0.85; }
    100% { transform: translateY(-115vh) rotate(360deg) scale(1.1); opacity: 0; }
  }

  .click-sparkle {
    position: absolute;
    pointer-events: none;
    z-index: 99;
    font-size: 22px;
    animation: tapPop 0.8s ease-out forwards;
  }

  @keyframes tapPop {
    0% { transform: translate(-50%, -50%) scale(0.2) rotate(0deg); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.3) rotate(var(--tr)); opacity: 0; }
  }
</style>

<script>
const CONFIG = {
  recipientName: "Seav Mey",
  telegramBotToken: "YOUR_BOT_TOKEN_HERE",
  telegramChatId: "YOUR_CHAT_ID_HERE",
  initialBadge: "I'm sorry... 🥺",
  dodgeBadge: "Please don't... 🥺💔",
  happyBadge: "Love you! 🥰✨",
  dodgeReplies: [
    "Not yet 🙈",
    "Wait no 🥺",
    "Pretty please? 🍒",
    "Don't be mad beb 💕",
    "Look at her face! 🥺",
    "You know you love me 😉",
    "Click Yes please! 💖"
  ],
  floatingEmojis: ["💗", "🌸", "🍒", "✨", "💕", "🌷", "🎀", "💖"],
  sparkleSymbols: ["✨", "💖", "🌸", "💕"],
  chimeNotes: [523.25, 659.25, 783.99, 1046.50]
};

const dom = {
  girl: document.getElementById("girlChar"),
  badge: document.getElementById("moodBadge"),
  yesBtn: document.getElementById("yes"),
  noBtn: document.getElementById("no"),
  interactive: document.getElementById("interactiveArea"),
  celebration: document.getElementById("celebration")
};

let dodgeCount = 0;
let badgeResetTimer = null;

function hasTelegramConfig() {
  return (
    Boolean(CONFIG.telegramBotToken) &&
    CONFIG.telegramBotToken !== "YOUR_BOT_TOKEN_HERE" &&
    Boolean(CONFIG.telegramChatId) &&
    CONFIG.telegramChatId !== "YOUR_CHAT_ID_HERE"
  );
}

async function sendTelegramNotification() {
  if (!hasTelegramConfig()) {
    console.warn("Telegram bot token or chat ID is not configured.");
    return;
  }

  const now = new Date();
  const timeString = `${now.toLocaleDateString()} ${now.toLocaleTimeString()}`;
  const message =
    `🎉 <b>She Forgave You! 💗</b>\n\n` +
    `🥰 <b>${CONFIG.recipientName}</b> clicked:\n` +
    `<i>"Yes, I forgive you 💖"</i>\n\n` +
    `⏰ <b>Time:</b> ${timeString}`;

  try {
    const response = await fetch(
      `https://api.telegram.org/bot${CONFIG.telegramBotToken}/sendMessage`,
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          chat_id: CONFIG.telegramChatId,
          text: message,
          parse_mode: "HTML"
        })
      }
    );
    const data = await response.json();
    if (!data.ok) {
      console.error("Telegram API error:", data);
    }
  } catch (error) {
    console.error("Network error sending Telegram notification:", error);
  }
}

function tickleCharacter() {
  const angle = Math.random() > 0.5 ? 6 : -6;
  dom.girl.style.transform = `scale(1.12) rotate(${angle}deg)`;
  createTapHearts(window.innerWidth / 2, window.innerHeight / 2 - 40);
  setTimeout(() => {
    dom.girl.style.transform = "";
  }, 300);
}

function handleForgive() {
  sendTelegramNotification();

  dom.girl.classList.add("happy");
  dom.badge.textContent = CONFIG.happyBadge;
  dom.badge.style.background = "#ff3b77";
  dom.badge.style.color = "#ffffff";

  dom.interactive.style.display = "none";
  dom.celebration.style.display = "block";

  playSweetChime();

  for (let i = 0; i < 60; i++) {
    setTimeout(createFloatingItem, i * 80);
  }
}

function handleDodge() {
  dodgeCount += 1;
  dom.noBtn.textContent = CONFIG.dodgeReplies[dodgeCount % CONFIG.dodgeReplies.length];

  // Keep displacement bounded so the button stays reachable/visible near the card
  const x = Math.random() * 120 - 60;
  const y = Math.random() * 80 - 40;

  dom.noBtn.style.transition = "all 0.2s cubic-bezier(0.18, 0.89, 0.32, 1.28)";
  dom.noBtn.style.transform = `translate(${x}px, ${y}px) scale(0.95)`;

  dom.badge.textContent = CONFIG.dodgeBadge;
  clearTimeout(badgeResetTimer);
  badgeResetTimer = setTimeout(() => {
    if (!dom.girl.classList.contains("happy")) {
      dom.badge.textContent = CONFIG.initialBadge;
    }
  }, 1200);
}

function createFloatingItem() {
  const el = document.createElement("div");
  const duration = Math.random() * 3 + 4;

  el.className = "float-item";
  el.textContent = CONFIG.floatingEmojis[Math.floor(Math.random() * CONFIG.floatingEmojis.length)];
  el.style.left = `${Math.random() * 96 + 2}vw`;
  el.style.fontSize = `${Math.random() * 16 + 18}px`;
  el.style.animationDuration = `${duration}s`;

  document.body.appendChild(el);
  setTimeout(() => el.remove(), duration * 1000);
}

function createTapHearts(x, y) {
  for (let i = 0; i < 4; i++) {
    const sparkle = document.createElement("div");
    sparkle.className = "click-sparkle";
    sparkle.textContent = CONFIG.sparkleSymbols[Math.floor(Math.random() * CONFIG.sparkleSymbols.length)];
    sparkle.style.left = `${x}px`;
    sparkle.style.top = `${y}px`;

    sparkle.style.setProperty("--tx", `${Math.random() * 70 - 35}px`);
    sparkle.style.setProperty("--ty", `${Math.random() * -70 - 15}px`);
    sparkle.style.setProperty("--tr", `${Math.random() * 90 - 45}deg`);

    document.body.appendChild(sparkle);
    setTimeout(() => sparkle.remove(), 800);
  }
}

function playSweetChime() {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;

    const ctx = new AudioCtx();
    CONFIG.chimeNotes.forEach((freq, idx) => {
      const startTime = ctx.currentTime + idx * 0.1;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, startTime);

      gain.gain.setValueAtTime(0.001, startTime);
      gain.gain.exponentialRampToValueAtTime(0.2, startTime + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 1.2);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(startTime);
      osc.stop(startTime + 1.3);
    });
  } catch {
    // Ignore audio errors on restricted devices
  }
}

dom.girl.addEventListener("click", tickleCharacter);
dom.yesBtn.addEventListener("click", handleForgive);
dom.noBtn.addEventListener("mouseover", handleDodge);
dom.noBtn.addEventListener("click", handleDodge);
window.addEventListener("pointerdown", (e) => createTapHearts(e.clientX, e.clientY));

setInterval(createFloatingItem, 450);
</script>
